ligence", "content": "Artificial intelligence is a branch of technology where machines do tasks that normally need human intelligence. Before we use this term, let us define it: a machine is a piece of equipment with moving parts or computer code designed to do a particular job. Think about the voice assistant on your phone that answers when you speak, map apps that guide you through busy Delhi traffic, or video recommendations that show your favorite cartoons. These are all examples of artificial intelligence in action.", "image": null, "caption": null}, {"title": "Human vs. Artificial Intelligence", "content": "Let us compare humans and artificial intelligence side by side. Humans have feelings, common sense, creativity, and the ability to understand why things happen. Artificial intelligence, on the other hand, has incredible speed, never gets tired, and can handle huge data, but it has no feelings or real understanding of what it is doing. For example, a music app can play thousands of songs instantly, but it does not actually feel happy when a cheerful song plays.", "image": null, "caption": null}, {"title": "Rule-Based Systems", "content": "A rule-based system is a machine that follows fixed rules written by a person. A rule is a clear instruction that tells a computer what to do step by step. Examples include a traffic signal timer, a calculator adding two numbers, or a teacher's rule saying 'if the marks are above 90 then grade A'. A rule-based system cannot handle anything outside the rules its creator wrote for it.", "image": null, "caption": null}, {"title": "Learning Systems", "content": "A learning system is a machine that finds patterns from many examples instead of using fixed rules. To understand this, data means a collection of facts, numbers, or pictures used for analysis. The flow works like this: Examples or data go into Learning, which creates a Model, which then gives the Answer. For instance, instead of writing rules for what a cat looks like, you show the machine thousands of photos of cats so it learns to recognize them on its own. Other examples include spam filters in your email and song recommendations on mobile music apps.", "image": null, "caption": null}, {"title": "Rule-Based vs. Learning Systems", "content": "Let us compare rule-based and learning systems. A rule-based system uses strict human-written instructions and cannot adapt. A learning system studies many examples to find patterns and improve itself over time. For example, a simple digital calculator is a rule-based system because it always follows strict math formulas. A YouTube video recommendation system is a learning system because it learns from the videos you watch every day to suggest new ones.", "image": null, "caption": null}, {"title": "Activity: Is it AI or Not? - Part 1", "content": "Let us test your skills with some everyday items. First item: A calculator adding two numbers. Is it AI or not? Answer: Not AI, because it follows fixed rules. Second item: YouTube suggesting videos you may like. Is it AI or not? Answer: AI, because it learns from what you watch. Third item: An automatic door that opens when someone is near. Is it AI or not? Answer: Not AI, because it relies on a simple sensor rule.", "image": null, "caption": null}, {"title": "Activity: Is it AI or Not? - Part 2", "content": "Let us continue our activity with three more items. Fourth item: A mobile phone unlocking with your face. Is it AI or not? Answer: AI, because it recognizes facial patterns. Fifth item: A washing machine running a fixed 30-minute cycle. Is it AI or not? Answer: Not AI, because it follows a fixed timer rule. Sixth item: A chatbot answering your questions. Is it AI or not? Answer: AI, because it understands and responds to human language.", "image": null, "caption": null}], "key_concepts": ["Intelligence", "Natural Intelligence", "Artificial Intelligence", "Rule-Based Systems", "Learning Systems"], "practical_examples": ["A child learning to e powers modern tools, and how machines process information either through rigid rule-based systems or flexible learning systems.", "concept_check": [{"id": "cc001", "question": "What is natural intelligence?", "options": ["Intelligence found only in computers", "The ability of living things to learn and grow from experience", "A machine following fixed rules", "A calculator adding numbers"], "correct": "The ability of living things to learn and grow from experience", "explanation": "Natural intelligence refers to humans and animals learning from real-life experiences, such as riding a bicycle."}, {"id": "cc002", "question": "Which of the following describes a rule-based system?", "options": ["A system that learns from thousands of cat photos", "A machine that follows fixed rules written by a person", "A system that feels happy when it wins a game", "An animal solving a puzzle"], "correct": "A machine that follows fixed rules written by a person", "explanation": "Rule-based systems operate strictly according to pre-written instructions, like a traffic signal timer or calculator."}, {"id": "cc003", "question": "What is the correct flow for a learning system?", "options": ["Answer -> Model -> Learning -> Examples", "Examples -> Learning -> Model -> Answer", "Rules -> Calculator -> Traffic -> Score", "Feelings -> Speed -> Machine -> Human"], "correct": "Examples -> Learning -> Model -> Answer", "explanation": "Learning systems start with examples (data), go through a learning process to build a model, and then produce an answer."}], "quiz": [{"id": "q001", "question": "Which of the following is an everyday sign of human intelligence?", "options": ["Running on electricity without a battery", "Understanding language and solving problems", "Following a fixed 30-minute washing machine cycle", "Adding two numbers using a digital calculator"], "correct": "Understanding language and solving problems", "explanation": "Understanding language, learning, and solving problems are     finished = true;
    buttons.forEach(function(b){ b.disabled = true; if (b.dataset.v === q.correct) b.classList.add("good"); });
    if (q.explanation) fb.innerHTML = '<div class="fb ' + (correct ? "good" : "info") + '">' + (correct ? "Correct! " : "The answer is: <b>" + esc(q.correct) + "</b>. ") + esc(q.explanation) + "</div>";
    if (opts.onDone) opts.onDone(correct, tries);
  }
  q.options.forEach(function(text){
    var b = document.createElement("button"); b.className = "opt"; b.textContent = text; b.dataset.v = text; buttons.push(b);
    b.onclick = function(){
      if (finished) return; tries++;
      if (text === q.correct){ b.classList.add("good"); end(true); }
      else if (opts.oneShot || tries >= 2){ b.classList.add("bad"); end(false); }
      else { b.classList.add("bad"); b.disabled = true; fb.innerHTML = '<div class="fb bad">Not quite. Think again and try another answer.</div>'; }
    };
    wrap.appendChild(b);
  });
  wrap.appendChild(fb);
  return wrap;
}

/* ---------- video with pauses ---------- */
var vid = $("vid"), ov = $("overlay");
var gates = D.scenes.filter(function(s){ return (s.interaction === "concept_check" && s.question) || (s.interaction === "pause_continue" && s.pause_after); });
var activeGate = null;
function doneCount(){ return Object.keys(S.done).length; }
function refreshProgress(){
  var total = gates.filter(function(g){ return g.interaction === "concept_check"; }).length;
  var ok = Object.keys(S.done).filter(function(k){ return S.done[k] && S.done[k].correct; }).length;
  $("chipChecks").textContent = "Checks answered right: " + ok + " / " + total;
  $("bar").style.width = (total ? Math.round(100 * doneCount() / total) : 0) + "%";
  drawScenes();
}
function drawScenes(){
  var ul = $("scenes"); ul.innerHTML = "";
  D.scenes.forEach(function(s){
    var li = document.createElement("li"); var d = S.done[s.n];
    var cls = "dot" + (d ? (d.correct ? " ok" : " part") : ""); var sym = d ? (d.correct ? "&#10003;" : "&#8226;") : s.n;
    li.innerHTML = '<span class="' + cls + '">' + sym + '</span><span>' + esc(s.title) + ' <span class="muted">(' + fmt(s.start) + ')</span></span>';
    li.onclick = function(){ closeOverlay(); vid.currentTime = s.start + 0.05; vid.play(); show("video"); };
    ul.appendChild(li);
  });
}
function closeOverlay(){ ov.className = "overlay"; ov.innerHTML = ""; activeGate = null; }
function openGate(g){
  activeGate = g; vid.pause(); if (document.fullscreenElement) document.exitFullscreen();
  ov.innerHTML = ""; ov.className = "overlay on";
  var box = document.createElement("div"); box.className = "q";
  var tag = document.createElement("div"); tag.className = "tag"; tag.textContent = "Quick check - " + g.title; box.appendChild(tag);
  function actions(){
    var rep = document.createElement("button"); rep.className = "btn alt"; rep.textContent = "Replay this part";
    rep.onclick = function(){ closeOverlay(); vid.currentTime = g.start + 0.05; vid.play(); };
    var go = document.createElement("button"); go.className = "btn"; go.textContent = "Continue";
    go.onclick = function(){ var t = g.gate + 0.1; closeOverlay(); vid.currentTime = t; vid.play(); };
    box.appendChild(rep); box.appendChild(go);
  }
  if (g.interaction === "concept_check"){
    var prev = S.done[g.n];
    box.appendChild(questionCard(g.question, {onDone: function(correct, tries){
      S.done[g.n] = {correct: correct, tries: tries}; save(); refreshProgress(); actions();
    }}));
  } else {
    var p = document.createElement("div"); p.className = "fb info"; p.textContent = "Take a moment to think about what you just learned."; box.appendChild(p);
    S.done[g.n] = {correct: true, tries: 0}; save(); refreshProgress(); actions();
  }
  ov.appendChild(box);
}
var lastSave = 0;
vid.addEventListener("timeupdate", function(){
  var t = vid.currentTime;
  if (t - lastSave > 5 || t < lastSave){ lastSave = t; S.pos = t; save(); }
  if (activeGate) return;
  for (var i = 0; i < gates.length; i++){
    var g = gates[i];
    if (!S.done[g.n] && t >= g.gate - 0.12 && t < g.gate + 1.5){ openGate(g); return; }
  }
});
vid.addEventListener("play", function(){ if (activeGate){ vid.pause(); } });
vid.addEventListener("ended", function(){
  ov.className = "overlay on"; ov.innerHTML = "";
  var box = document.createElement("div"); box.className = "q";
  var ok = Object.keys(S.done).filter(function(k){ return S.done[k].correct; }).length;
  box.innerHTML = "<h3>Lesson complete!</h3><div class='fb good'>You answered " + ok + " of " + gates.length + " quick checks correctly.</div>";
  var quiz = document.createElement("button"); quiz.className = "btn"; quiz.textContent = "Take the final quiz";
  quiz.onclick = function(){ closeOverlay(); show("quiz"); };
  var again = document.createElement("button"); again.className = "btn alt"; again.textContent = "Watch again";
  again.onclick = function(){ closeOverlay(); vid.currentTime = 0; vid.play(); };
  box.appendChild(quiz); box.appendChild(again); ov.appendChild(box);
});
if (S.pos > 15){
  var rb = $("resumeBox"); rb.style.display = "block";
  rb.innerHTML = "You stopped at <b>" + fmt(S.pos) + "</b>. ";
  var bt = document.createElement("button"); bt.className = "btn"; bt.textContent = "Resume from " + fmt(S.pos);
  bt.onclick = function(){ vid.currentTime = S.pos; vid.play(); rb.style.display = "none"; };
  rb.appendChild(bt);
}

/* ---------- summary / examples ---------- */
(function(){
  var h = "<h2>Summary</h2><p>" + esc(D.simple_summary || D.lesson_summary || "") + "</p>";
  if ((D.key_concepts || []).length){ h += "<h3 class='sub'>Key ideas</h3>" + D.key_concepts.map(function(k){ return "<span class='tag'>" + esc(k) + "</span>"; }).join(""); }
  if ((D.takeaways || []).length){ h += "<h3 class='sub'>Remember</h3><ul>" + D.takeaways.map(function(k){ return "<li>" + esc(k) + "</li>"; }).join("") + "</ul>"; }
  $("summaryBox").innerHTML = h;
  var e = "<h2>Real-life examples</h2>" + (D.real_life_examples || []).map(function(x){ return "<div class='example'>" + esc(x) + "</div>"; }).join("");
  if ((D.practical_examples || []).length){ e += "<h3 class='sub'>More examples</h3>" + D.practical_examples.map(function(x){ return "<div class='example'>" + esc(typeof x === "string" ? x : (x.title ? x.title + ": " : "") + (x.description || x.example || "")) + "</div>"; }).join(""); }
  $("examplesBox").innerHTML = e;
})();

/* ---------- check the concept ---------- */
(function(){
  var box = $("checkBox");
  (D.concept_check || []).forEach(function(q, i){
    var card = document.createElement("div"); card.className = "card"; card.style.background = "#faf8ff";
    var n = document.createElement("div"); n.className = "muted"; n.textContent = "Question " + (i + 1) + " of " + D.concept_check.length; card.appendChild(n);
    card.appendChild(questionCard(q, {onDone: function(c){ S.checks[q.id] = c; save(); }}));
    box.appendChild(card);
  });
  if (!(D.concept_check || []).length) box.textContent = "No questions in this lesson.";
})();

/* ---------- lesson notes ---------- */
(function(){
  var h = "<h2>Lesson notes</h2>";
  (D.sections || []).forEach(function(s){
    h += "<h3 class='sub'>" + esc(s.title) + "</h3>";
    if (s.image) h += "<img class='sec' src='" + esc(s.image) + "' alt='" + esc(s.caption || s.title) + "'>" + (s.caption ? "<div class='muted'>" + esc(s.caption) + "</div>" : "");
    h += String(s.content || "").split(/\n+/).map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("");
  });
  if ((D.glossary || []).length){ h += "<h3 class='sub'>Glossary</h3>" + D.glossary.map(function(g){ return "<p><b>" + esc(g.term) + ":</b> " + esc(g.definition) + "</p>"; }).join(""); }
  $("lessonBox").innerHTML = h;
})();

/* ---------- final quiz ---------- */
function buildQuiz(){
  var box = $("quizBox"); box.innerHTML = "";
  var qs = D.quiz || [];
  if (!qs.length){ box.textContent = "No quiz in this lesson."; return; }
  if (S.quiz){ var p = document.createElement("div"); p.className = "fb info"; p.textContent = "Your best score so far: " + S.quiz.best + "%."; box.appendChild(p); }
  var results = {}, count = 0;
  qs.forEach(function(q, i){
    var card = document.createElement("div"); card.className = "card"; card.style.background = "#faf8ff";
    var n = document.createElement("div"); n.className = "muted"; n.textContent = "Question " + (i + 1) + " of " + qs.length; card.appendChild(n);
    card.appendChild(questionCard(q, {oneShot: true, onDone: function(c){
      results[q.id] = c; count++;
      if (count === qs.length){
        var right = Object.keys(results).filter(function(k){ return results[k]; }).length, pct = Math.round(100 * right / qs.length);
        S.quiz = {best: Math.max(pct, S.quiz ? S.quiz.best : 0), last: pct}; save();
        var done = document.createElement("div"); done.className = "fb " + (pct >= 70 ? "good" : "bad");
        done.innerHTML = "<b>You scored " + right + " / " + qs.length + " (" + pct + "%).</b> " + (pct >= 70 ? "Well done!" : "Watch the lesson again and try once more.");
        var again = document.createElement("button"); again.className = "btn"; again.textContent = "Try the quiz again"; again.onclick = buildQuiz;
        done.appendChild(document.createElement("br")); done.appendChild(again); box.appendChild(done); done.scrollIntoView({behavior: "smooth", block: "center"});
      }
    }}));
    box.appendChild(card);
  });
}
buildQuiz();
refreshProgress();
})();
</script>
